<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Queue Display</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Queue Display">
<link rel="apple-touch-icon" href="/static/icon-512.png">

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #2c5364);
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}
.container { text-align: center; }
.queue {
    font-size: 240px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0 10px 20px rgba(0,0,0,0.5);
    animation: pop 0.4s ease-out;
}
.subtitle { font-size: 42px; margin-top: 20px; }

@keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* ปุ่มปลดล็อกเสียงสำหรับ iPhone */
#unlock {
    position: fixed;
    inset: 0;
    background: black;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    z-index: 9999;
    text-align: center;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="unlock">แตะหน้าจอหนึ่งครั้ง<br>เพื่อเริ่มระบบเสียง</div>

<div class="container">
    <div class="queue" id="queue">--</div>
    <div class="subtitle">เมนูที่สั่งได้แล้วค่ะ</div>
</div>

<script>
/* =======================
   ตั้งค่าการเชื่อมต่อ
======================= */
const socket = io();
const queueEl = document.getElementById("queue");
const unlock = document.getElementById("unlock");
let unlocked = false;

/* =======================
   ระบบเสียง (Web Speech API)
   🎯 แก้ไข: เสียงผู้หญิงไทย (Kanya), พูดช้าลง 0.8
======================= */
function speak(text) {
    if (!unlocked) return;

    // เคลียร์เสียงเก่าทิ้งทันที
    window.speechSynthesis.cancel();

    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'th-TH';
    msg.rate = 0.8; // 🎯 พูดช้าลงตามที่มึงสั่ง
    msg.pitch = 1.0;

    // 🎯 บังคับเลือกเสียงผู้หญิงไทย (เน้น Kanya สำหรับ iPhone)
    const voices = window.speechSynthesis.getVoices();
    let femaleVoice = voices.find(v => v.lang === 'th-TH' && v.name.includes('Kanya'));
    
    if (!femaleVoice) {
        femaleVoice = voices.find(v => v.lang === 'th-TH' && (v.name.includes('Female') || v.name.includes('Premium')));
    }
    
    if (femaleVoice) {
        msg.voice = femaleVoice;
    }

    window.speechSynthesis.speak(msg);
}

// โหลดรายการเสียงสำหรับ Safari/Chrome
if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

unlock.addEventListener("click", () => {
    unlocked = true;
    unlock.style.display = "none";
    speak("เริ่มระบบค่ะ");
});

/* =======================
   รับสัญญาณจาก Server (app.py)
======================= */
socket.on("call_queue", data => {
    // อัปเดตเลขทันที
    queueEl.innerText = data.queue;
    queueEl.style.animation = "none";
    queueEl.offsetHeight; 
    queueEl.style.animation = "pop 0.4s ease-out";
    
    // สั่งให้พูดรหัสคิว
    speak(data.msg);
});

socket.on("speak_only", data => {
    // พูดประโยคข้ามคิว
    speak(data.msg);
});

socket.on("queue_updated", data => {
    if (data.current) {
        queueEl.innerText = data.current;
        if (data.current !== "--") {
            queueEl.style.animation = "none";
            queueEl.offsetHeight;
            queueEl.style.animation = "pop 0.4s ease-out";
        }
    }
});
</script>

</body>
</html>
