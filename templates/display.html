<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Queue Display</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Queue Display">

<style>
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #0f2027, #2c5364);
        color: white;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }
    .container { text-align: center; }

    .queue {
        font-size: clamp(96px, 22vw, 240px);
        font-weight: bold;
        color: #ffd700;
        text-shadow: 0 10px 20px rgba(0,0,0,0.5);
        transition: all 0.3s ease;
    }

    .subtitle {
        font-size: clamp(24px, 5vw, 48px);
        margin-top: 20px;
        color: #e0e0e0;
        letter-spacing: 2px;
    }

    /* ปุ่มปลดล็อกหน้าจอ (Overlay) */
    #unlock-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        cursor: pointer;
    }
    #unlock-overlay h2 { font-size: 32px; margin-bottom: 20px; }
    #unlock-overlay p { font-size: 18px; color: #aaa; }

    @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); color: #fff; }
        100% { transform: scale(1); }
    }
</style>
</head>

<body>

<div id="unlock-overlay" onclick="initAudio()">
    <h2>📢 คลิกที่นี่เพื่อเริ่มระบบเสียง</h2>
    <p>(Browser บล็อกเสียงอัตโนมัติ ต้องแตะหนึ่งครั้งครับ)</p>
</div>

<div class="container">
    <div class="queue" id="queue">--</div>
    <div class="subtitle">เชิญที่ช่องบริการค่ะ</div>
</div>

<script>
const socket = io();
const queueEl = document.getElementById("queue");
const unlockOverlay = document.getElementById("unlock-overlay");
let isAudioEnabled = false;

/* ==================================
   1. ระบบปลดล็อกเสียง (สำคัญมาก)
   ================================== */
function initAudio() {
    isAudioEnabled = true;
    unlockOverlay.style.display = "none";
    
    // ทดสอบพูดสั้นๆ เพื่อเปิดทางให้ Browser
    const msg = new SpeechSynthesisUtterance("เริ่มระบบค่ะ");
    msg.lang = 'th-TH';
    msg.volume = 0; // ไม่ต้องออกลำโพงตอนนี้
    window.speechSynthesis.speak(msg);
    console.log("Audio Unlocked!");
}

/* ==================================
   2. ฟังก์ชันเสียง (ซ่อมให้อ่านแยกหลัก)
   ================================== */
function formatSpeakText(text) {
    if (text.includes("Q")) {
        let nums = text.replace("Q", "").split("").join(" ");
        return "คิว " + nums + " ค่ะ";
    }
    return text;
}

function getThaiVoice() {
    const voices = window.speechSynthesis.getVoices();
    return voices.find(v => v.lang.startsWith('th')) || null;
}

function speak(text) {
    if (!isAudioEnabled) return;

    // เคลียร์เสียงที่ค้างอยู่
    window.speechSynthesis.cancel();

    setTimeout(() => {
        const formattedText = formatSpeakText(text);
        const msg = new SpeechSynthesisUtterance(formattedText);
        msg.lang = 'th-TH';
        msg.rate = 0.8;
        msg.pitch = 1.1;

        const voice = getThaiVoice();
        if (voice) msg.voice = voice;

        window.speechSynthesis.speak(msg);
    }, 100);
}

// โหลดเสียงเตรียมไว้
window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

/* ==================================
   3. Socket Events (รับค่าจาก Counter/Server)
   ================================== */
socket.on("call_queue", data => {
    queueEl.innerText = data.queue;
    
    // ทำ Animation กระเด้ง
    queueEl.style.animation = "none";
    queueEl.offsetHeight; 
    queueEl.style.animation = "pop 0.5s ease-out";
    
    speak(data.msg);
});

socket.on("speak_only", data => {
    speak(data.msg);
});

socket.on("queue_updated", data => {
    if (data.current) {
        queueEl.innerText = data.current;
    }
});

socket.on("reset_done", () => {
    queueEl.innerText = "--";
});
</script>
</body>
</html>
