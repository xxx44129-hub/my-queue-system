<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Queue Display</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Queue Display">
<link rel="apple-touch-icon" href="/static/icon-512.png">

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #2c5364);
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
.container { text-align: center; }
.queue {
    font-size: 240px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0 10px 20px rgba(0,0,0,0.5);
    animation: pop 0.4s ease-out;
}
.subtitle { font-size: 42px; margin-top: 20px; }
@keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}
#unlock {
    position: fixed;
    inset: 0;
    background: black;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    z-index: 9999;
    text-align: center;
    cursor: pointer;
}
</style>
</head>

<body>
<div id="unlock">แตะหน้าจอหนึ่งครั้ง<br>เพื่อเปิดระบบเสียงแบบ Real-time</div>

<div class="container">
    <div class="queue" id="queue">--</div>
    <div class="subtitle">เมนูที่สั่งได้แล้วค่ะ</div>
</div>

<script>
const socket = io();
const queueEl = document.getElementById("queue");
const unlock = document.getElementById("unlock");
let unlocked = false;

/* ==================================
   ระบบเสียงใหม่: พูดจากข้อความ (ไม่ต้องใช้ไฟล์)
   ================================== */
function speak(text) {
    if (!unlocked) return;
    // ตัดเสียงที่กำลังพูดอยู่ทิ้งเพื่อพูดอันใหม่ทันที
    window.speechSynthesis.cancel(); 
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'th-TH'; // ตั้งเป็นภาษาไทย
    msg.rate = 1.0;     // ความเร็วปกติ
    window.speechSynthesis.speak(msg);
}

unlock.addEventListener("click", () => {
    unlocked = true;
    unlock.style.display = "none";
    // ทดสอบเสียงตอนเริ่ม
    speak("เริ่มระบบเรียบร้อยค่ะ");
});

/* ==================================
   รับสัญญาณเรียกคิว (แก้เลขดีเลย์)
   ================================== */
socket.on("call_queue", data => {
    // 🎯 เปลี่ยนเลขทันทีที่ได้รับสัญญาณ
    queueEl.innerText = data.queue;
    queueEl.style.animation = "none";
    queueEl.offsetHeight; 
    queueEl.style.animation = "pop 0.4s ease-out";
    
    // 🎯 สั่งให้ Browser พูดข้อความที่ Server ส่งมา
    speak(data.msg);
});

socket.on("speak_only", data => {
    speak(data.msg);
});

socket.on("queue_updated", data => {
    if (data.current) {
        queueEl.innerText = data.current;
    }
});
</script>
</body>
</html>
