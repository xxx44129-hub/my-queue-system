<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>Queue Display System</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #2c5364, #203a43);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container { text-align: center; }

        .queue-label {
            font-size: 50px;
            color: #e0e0e0;
            margin-bottom: -10px;
            font-weight: 300;
        }

        .queue {
            font-size: clamp(120px, 30vw, 280px);
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 15px 30px rgba(0,0,0,0.6);
            margin: 0;
        }

        .subtitle {
            font-size: clamp(24px, 6vw, 50px);
            margin-top: 30px;
            color: #ffffff;
            letter-spacing: 3px;
            font-weight: 400;
        }

        /* หน้ากากปลดล็อกเสียง (iOS บังคับ) */
        #unlock-screen {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
        }

        .unlock-button {
            padding: 25px 50px;
            background: #ffd700;
            color: black;
            font-size: 30px;
            font-weight: bold;
            border-radius: 60px;
            box-shadow: 0 0 30px rgba(255,215,0,0.4);
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); color: #fff; }
            100% { transform: scale(1); }
        }
        .animate-pop { animation: pop 0.5s ease-out; }
    </style>
</head>
<body>

<div id="unlock-screen" onclick="handleUnlockAudio()">
    <div class="unlock-button">แตะหน้าจอเพื่อเริ่มระบบ (เสียง)</div>
    <p style="margin-top: 20px; font-size: 20px; color: #ccc;">กรุณาแตะ 1 ครั้งเพื่อให้เสียงทำงานบน iPhone</p>
</div>

<div class="container">
    <div class="queue-label">หมายเลขคิว</div>
    <div class="queue" id="queue-display">--</div>
    <div class="subtitle">เมนูที่สั่งได้แล้วค่ะ</div>
</div>

<script>
    const socket = io();
    const queueElement = document.getElementById("queue-display");
    const unlockScreen = document.getElementById("unlock-screen");
    
    // โหลดไฟล์เสียง Beep จาก static
    const beepAudio = new Audio("/static/beep.mp3");
    let isAudioUnlocked = false;

    // ค้นหาเสียงผู้หญิงไทย
    function findThaiFemaleVoice() {
        const voices = window.speechSynthesis.getVoices();
        return voices.find(v => v.lang.includes('th') && (v.name.includes('Kanya') || v.name.includes('Narisa') || v.name.includes('Female'))) 
               || voices.find(v => v.lang.includes('th'));
    }

    // ฟังก์ชันปลดล็อกเสียงสำหรับ iPhone
    function handleUnlockAudio() {
        isAudioUnlocked = true;
        unlockScreen.style.display = "none";
        
        // ทดสอบเล่นเสียงสั้นๆ เพื่อเปิดทางลำโพง
        beepAudio.play().then(() => {
            beepAudio.pause();
            beepAudio.currentTime = 0;
        }).catch(e => console.log("Audio unlock failed:", e));
        
        const welcome = new SpeechSynthesisUtterance("ระบบเริ่มทำงานค่ะ");
        welcome.lang = 'th-TH';
        window.speechSynthesis.speak(welcome);
    }

    // ฟังก์ชัน: เล่นเสียง Beep แล้วค่อยพูดคิว
    function playQueueVoice(queueText) {
        if (!isAudioUnlocked) return;

        // หยุดเสียงที่พูดค้างอยู่ทั้งหมด
        window.speechSynthesis.cancel();

        // 1. เล่นเสียง Beep
        beepAudio.play().then(() => {
            // 2. รอจังหวะนิดนึงให้ Beep นำก่อนแล้วค่อยพูด (ปรับ 800ms ตามใจชอบ)
            setTimeout(() => {
                // อ่านแยกหลัก: คิว ศูนย์ ศูนย์ หนึ่ง
                let digits = queueText.replace("Q", "").split("").join(" ");
                const msg = new SpeechSynthesisUtterance("คิว " + digits);
                msg.lang = 'th-TH';
                msg.rate = 0.9;
                
                const voice = findThaiFemaleVoice();
                if (voice) msg.voice = voice;
                
                window.speechSynthesis.speak(msg);
            }, 800); 
        }).catch(e => console.log("Beep error:", e));
    }

    /* --- รับสัญญาณ Socket --- */

    // รับสัญญาณเมื่อเคาน์เตอร์ "ปิด" สวิตช์เสียง
    socket.on("call_queue_display", function(data) {
        let q = data.queue;
        queueElement.innerText = q;
        
        // เอฟเฟกต์ตัวเลขเด้ง
        queueElement.classList.remove("animate-pop");
        void queueElement.offsetWidth;
        queueElement.classList.add("animate-pop");
        
        playQueueVoice(q);
    });

    // รับสัญญาณข้ามออเดอร์ หรือประกาศอื่นๆ
    socket.on("speak_only", function(data) {
        if (!isAudioUnlocked) return;
        window.speechSynthesis.cancel();
        
        beepAudio.play().then(() => {
            setTimeout(() => {
                const msg = new SpeechSynthesisUtterance(data.msg);
                msg.lang = 'th-TH';
                const voice = findThaiFemaleVoice();
                if (voice) msg.voice = voice;
                window.speechSynthesis.speak(msg);
            }, 800);
        });
    });

    socket.on("queue_updated", data => {
        if (data.current) queueElement.innerText = data.current;
    });

    socket.on("reset_done", () => {
        queueElement.innerText = "--";
    });

    window.speechSynthesis.onvoiceschanged = findThaiFemaleVoice;
</script>
</body>
</html>
