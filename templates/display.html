<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Queue Display</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Queue Display">
<link rel="apple-touch-icon" href="/static/icon-512.png">

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #2c5364);
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}
.container { text-align: center; }

.queue {
    font-size: clamp(96px, 22vw, 240px);
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0 10px 20px rgba(0,0,0,0.5);
    animation: pop 0.4s ease-out;
}

.subtitle {
    font-size: clamp(20px, 4.5vw, 42px);
    margin-top: 20px;
}

@keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

#unlock {
    position: fixed;
    inset: 0;
    background: black;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    z-index: 9999;
    text-align: center;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="unlock">แตะหน้าจอหนึ่งครั้ง<br>เพื่อเริ่มระบบเสียง</div>

<div class="container">
    <div class="queue" id="queue">--</div>
    <div class="subtitle">เมนูที่สั่งได้แล้วค่ะ</div>
</div>

<script>
const socket = io();
const queueEl = document.getElementById("queue");
const unlock = document.getElementById("unlock");
let unlocked = false;

/* =======================
   ระบบเสียง (แก้ไขให้ช้าลงและเป็นผู้หญิง)
======================= */
function getBestFemaleThaiVoice() {
    const voices = window.speechSynthesis.getVoices();
    const thaiVoices = voices.filter(v => v.lang && v.lang.startsWith("th"));

    // ลำดับความสำคัญของเสียงผู้หญิงไทย
    const priority = [
        v => /Google/i.test(v.name) && /Female|ผู้หญิง/i.test(v.name),
        v => /Kanya|Narisa/i.test(v.name),
        v => /Female/i.test(v.name),
        v => true
    ];

    for (let rule of priority) {
        const found = thaiVoices.find(rule);
        if (found) return found;
    }
    return null;
}

function speak(text) {
    if (!unlocked) return;

    window.speechSynthesis.cancel();

    const speakTask = () => {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'th-TH';
        msg.rate = 0.65;   // 🎯 แก้ไข: ปรับให้พูดช้าลงตามที่มึงสั่ง
        msg.pitch = 1.1;   // ปรับโทนให้ดูเป็นผู้หญิง

        const selectedVoice = getBestFemaleThaiVoice();
        if (selectedVoice) {
            msg.voice = selectedVoice;
        }

        window.speechSynthesis.speak(msg);
    };

    if (window.speechSynthesis.getVoices().length === 0) {
        window.speechSynthesis.onvoiceschanged = speakTask;
    } else {
        speakTask();
    }
}

window.speechSynthesis.getVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

unlock.addEventListener("click", () => {
    unlocked = true;
    unlock.style.display = "none";
    speak("เริ่มระบบค่ะ");
});

/* =======================
   Socket.IO Events (เดิมทั้งหมด)
======================= */
socket.on("call_queue", data => {
    queueEl.innerText = data.queue;
    queueEl.style.animation = "none";
    queueEl.offsetHeight; 
    queueEl.style.animation = "pop 0.4s ease-out";
    speak(data.msg);
});

socket.on("speak_only", data => {
    speak(data.msg);
});

socket.on("queue_updated", data => {
    if (data.current) {
        queueEl.innerText = data.current;
        if (data.current !== "--") {
            queueEl.style.animation = "none";
            queueEl.offsetHeight;
            queueEl.style.animation = "pop 0.4s ease-out";
        }
    }
});
</script>

</body>
</html>
