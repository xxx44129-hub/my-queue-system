<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>Queue Display</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #2c5364);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container { text-align: center; }

        .queue {
            font-size: clamp(96px, 22vw, 240px);
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: clamp(24px, 5vw, 48px);
            margin-top: 20px;
            color: #e0e0e0;
            letter-spacing: 2px;
        }

        #unlock {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.01);
            z-index: 9999;
            cursor: pointer;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); color: #fff; }
            100% { transform: scale(1); }
        }
    </style>
</head>

<body>

<div id="unlock"></div>

<div class="container">
    <div class="queue" id="queue">--</div>
    <div class="subtitle">เมนูที่สั่งได้แล้วค่ะ</div>
</div>

<script>
    const socket = io();
    const queueEl = document.getElementById("queue");
    let unlocked = false;

    // ฟังก์ชันพูดสำหรับหน้า Display
    function speak(text, customMsg = null) {
        if (!unlocked) return;
        window.speechSynthesis.cancel();

        let finalMessage = "";
        if (customMsg) {
            finalMessage = customMsg;
        } else {
            let digits = text.replace("Q", "").split("").join(" ");
            finalMessage = "คิว " + digits + " เมนูที่สั่งได้แล้วค่ะ";
        }

        const msg = new SpeechSynthesisUtterance(finalMessage);
        msg.lang = 'th-TH';
        msg.rate = 0.8;
        
        const voices = window.speechSynthesis.getVoices();
        const thaiVoice = voices.find(v => v.lang.startsWith('th'));
        if (thaiVoice) msg.voice = thaiVoice;

        window.speechSynthesis.speak(msg);
    }

    // ปลดล็อกเสียง
    document.getElementById("unlock").addEventListener("click", function() {
        unlocked = true;
        this.style.display = "none";
        const startMsg = new SpeechSynthesisUtterance("เริ่มระบบแสดงผลค่ะ");
        startMsg.lang = 'th-TH';
        window.speechSynthesis.speak(startMsg);
    });

    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

    /* --- Socket Events --- */

    // 🎯 รับคำสั่งเรียกคิวเมื่อ Counter ปิดสวิตช์เสียง (Server จะส่ง Event นี้มา)
    socket.on("call_queue_display", data => {
        queueEl.innerText = data.queue;
        
        // Animation
        queueEl.style.animation = "none";
        queueEl.offsetHeight; 
        queueEl.style.animation = "pop 0.4s ease-out";
        
        speak(data.queue);
    });

    // สำหรับเสียงข้ามออเดอร์ หรือประกาศอื่นๆ
    socket.on("speak_only", data => {
        speak(null, data.msg);
    });

    // อัปเดตตัวเลขหน้าจอ (ทำงานทุกครั้งที่เลขเปลี่ยน)
    socket.on("queue_updated", data => {
        if (data.current) {
            queueEl.innerText = data.current;
        }
    });

    socket.on("reset_done", () => {
        queueEl.innerText = "--";
    });
</script>
</body>
</html>
