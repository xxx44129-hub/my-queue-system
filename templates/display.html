<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Queue Display</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Queue Display">
<link rel="apple-touch-icon" href="/static/icon-512.png">

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #2c5364);
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
.container { text-align: center; }
.queue {
    font-size: 240px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0 10px 20px rgba(0,0,0,0.5);
    animation: pop 0.4s ease-out;
}
.subtitle { font-size: 42px; margin-top: 20px; }

@keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* overlay ปลดล็อกเสียง */
#unlock {
    position: fixed;
    inset: 0;
    background: black;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    z-index: 9999;
    text-align: center;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="unlock">แตะหน้าจอหนึ่งครั้ง<br>เพื่อเริ่มระบบเสียง</div>

<div class="container">
    <div class="queue" id="queue">--</div>
    <div class="subtitle">เมนูที่สั่งได้แล้วค่ะ</div>
</div>

<audio id="player" preload="auto"></audio>

<script>
/* =======================
   setup
======================= */
const socket = io();
const player = document.getElementById("player");
const unlock = document.getElementById("unlock");
const queueEl = document.getElementById("queue");

let unlocked = false;
let audioQueue = []; // คิวสำหรับเก็บเสียง
let isAudioProcessing = false; // ตัวแปรเช็คว่ากำลังเล่นเสียงอยู่ไหม

/* =======================
   ปลดล็อกเสียง (iOS SAFE)
======================= */
function unlockAudio() {
    if (unlocked) return;

    // เล่นเสียง beep สั้นๆ เพื่อขออนุญาตใช้ลำโพงเครื่อง
    player.src = "/static/beep.mp3";
    player.play().then(() => {
        player.pause();
        player.currentTime = 0;
        unlocked = true;
        unlock.style.display = "none";
        console.log("Audio unlocked");
    }).catch(err => {
        console.log("Unlock failed", err);
    });
}

unlock.addEventListener("click", unlockAudio);

/* =======================
   ระบบจัดการคิวเสียง (เล่นต่อกัน Beep -> พูด)
======================= */
function playNextAudio() {
    if (audioQueue.length === 0) {
        isAudioProcessing = false;
        return;
    }

    isAudioProcessing = true;
    const nextSrc = audioQueue.shift();
    
    // เติม v= ป้องกันแคชจำชื่อไฟล์เดิม
    player.src = nextSrc.includes('?') ? nextSrc : nextSrc + "?v=" + new Date().getTime();
    
    player.play().catch(err => {
        console.log("Play error, skipping...", err);
        playNextAudio();
    });

    player.onended = () => {
        playNextAudio();
    };
}

/* =======================
   เรียกคิว (แก้ให้ตัวเลขเปลี่ยนทันที)
======================= */
socket.on("call_queue", data => {
    // 1. อัปเดตตัวเลขบนจอทันที (ไม่รอเสียงจบ)
    queueEl.innerText = data.queue;
    queueEl.style.animation = "none";
    queueEl.offsetHeight; // บังคับรีเฟรชกราฟิก
    queueEl.style.animation = "pop 0.4s ease-out";

    // 2. โยนเสียงเข้าคิว (Beep ก่อน แล้วตามด้วยเสียงคนพูด)
    if (unlocked) {
        audioQueue.push("/static/beep.mp3");
        audioQueue.push(data.audio);
        if (!isAudioProcessing) playNextAudio();
    }
});

/* =======================
   ข้ามออร์เดอร์
======================= */
socket.on("speak_only", data => {
    if (unlocked) {
        audioQueue.push("/static/beep.mp3");
        audioQueue.push(data.audio);
        if (!isAudioProcessing) playNextAudio();
    }
});

/* =======================
   อัปเดตหน้าจอทั่วไป (เช่น Reset)
======================= */
socket.on("queue_updated", data => {
    if (data.current === "--") {
        queueEl.innerText = "--";
    }
});
</script>

</body>
</html>
