<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>Queue Display System</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    
    <style>
        /* CSS จัดเต็ม ดีไซน์หรูเหมือนเดิม */
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #2c5364, #203a43);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        .queue-label {
            font-size: 50px;
            color: #e0e0e0;
            margin-bottom: -20px;
            font-weight: 300;
        }

        .queue {
            font-size: clamp(120px, 30vw, 280px);
            font-weight: 900;
            color: #ffd700; /* สีทองแจ่มๆ */
            text-shadow: 0 15px 30px rgba(0,0,0,0.6);
            margin: 0;
        }

        .subtitle {
            font-size: clamp(24px, 6vw, 50px);
            margin-top: 30px;
            color: #ffffff;
            letter-spacing: 3px;
            font-weight: 400;
        }

        /* หน้ากากสำหรับให้ iPhone ปลดล็อกเสียง (ต้องแตะ 1 ครั้ง) */
        #unlock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
        }

        .unlock-button {
            padding: 20px 40px;
            background: #ffd700;
            color: black;
            font-size: 28px;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 0 20px rgba(255,215,0,0.5);
        }

        /* Animation เวลาเลขเปลี่ยน */
        @keyframes blink {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; color: #fff; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: blink 0.5s ease-out;
        }
    </style>
</head>
<body>

<div id="unlock-screen" onclick="handleUnlockAudio()">
    <div class="unlock-button">แตะหน้าจอเพื่อเปิดเสียง (iPhone)</div>
    <p style="margin-top: 20px; font-size: 18px;">เพื่อความเสถียรของระบบเสียงกรุณาแตะ 1 ครั้ง</p>
</div>

<div class="container">
    <div class="queue-label">หมายเลขคิว</div>
    <div class="queue" id="queue-display">--</div>
    <div class="subtitle">เมนูที่สั่งได้แล้วค่ะ</div>
</div>

<script>
    const socket = io();
    const queueElement = document.getElementById("queue-display");
    const unlockScreen = document.getElementById("unlock-screen");
    let isAudioActive = false;

    // ฟังก์ชันค้นหาเสียงผู้หญิงไทยแบบเน้นๆ ให้ iPhone
    function findThaiFemaleVoice() {
        const allVoices = window.speechSynthesis.getVoices();
        // ค้นหาเสียง Kanya, Narisa หรือเสียงที่มีคำว่า Female ในภาษาไทย
        let voice = allVoices.find(v => v.lang.includes('th') && (v.name.includes('Female') || v.name.includes('Kanya') || v.name.includes('Narisa')));
        
        // ถ้าไม่เจอจริงๆ เอาเสียงไทยตัวไหนก็ได้
        if (!voice) {
            voice = allVoices.find(v => v.lang.includes('th'));
        }
        return voice;
    }

    // ฟังก์ชันปลดล็อก (ต้องรันตอน User Gesture เท่านั้น)
    function handleUnlockAudio() {
        isAudioActive = true;
        unlockScreen.style.display = "none";
        
        // ทดสอบพูดเพื่อปลดล็อก Browser ลำโพง
        const welcome = new SpeechSynthesisUtterance("ระบบแสดงผลเริ่มทำงานค่ะ");
        welcome.lang = 'th-TH';
        window.speechSynthesis.speak(welcome);
    }

    // ฟังก์ชันหลักในการพูด (พูดเฉพาะ "คิว + เลข")
    function playQueueVoice(queueNumber) {
        if (!isAudioActive) return;

        // หยุดเสียงที่กำลังพูดค้างอยู่ทั้งหมดทันที
        window.speechSynthesis.cancel();

        // แปลงเลขคิวให้อ่านแยกหลัก เช่น Q001 -> คิว ศูนย์ ศูนย์ หนึ่ง
        let rawNumber = queueNumber.replace("Q", "");
        let separatedDigits = rawNumber.split("").join(" ");
        let speechText = "คิว " + separatedDigits;

        const utterance = new SpeechSynthesisUtterance(speechText);
        utterance.lang = 'th-TH';
        utterance.rate = 0.85; // ความเร็วพอดีๆ ไม่ช้าไม่เร็ว
        utterance.pitch = 1.0; // โทนเสียงปกติ

        // ใส่เสียงผู้หญิงไทย
        const femaleVoice = findThaiFemaleVoice();
        if (femaleVoice) {
            utterance.voice = femaleVoice;
        }

        // สั่งให้พูด
        window.speechSynthesis.speak(utterance);
    }

    // --- ส่วนรับสัญญาณจาก Socket.io ---

    // เมื่อได้รับคำสั่งให้ "ดังที่หน้า Display"
    socket.on("call_queue_display", function(data) {
        let newQueue = data.queue;
        
        // แสดงเลขบนหน้าจอ
        queueElement.innerText = newQueue;
        
        // ใส่เอฟเฟกต์กระพริบ
        queueElement.classList.remove("animate-pop");
        void queueElement.offsetWidth; // trigger reflow
        queueElement.classList.add("animate-pop");
        
        // 🎯 สั่งพูด (พูดแค่ "คิว + เลข" ตามที่มึงสั่ง)
        playQueueVoice(newQueue);
    });

    // อัปเดตตัวเลขหน้าจอเฉยๆ (กรณี Sync ข้อมูล)
    socket.on("queue_updated", function(data) {
        if (data.current) {
            queueElement.innerText = data.current;
        }
    });

    // กรณีมีข้อความประกาศพิเศษ (เช่น ข้ามออเดอร์)
    socket.on("speak_only", function(data) {
        if (!isAudioActive) return;
        window.speechSynthesis.cancel();
        
        const announce = new SpeechSynthesisUtterance(data.msg);
        announce.lang = 'th-TH';
        
        const voice = findThaiFemaleVoice();
        if (voice) announce.voice = voice;
        
        window.speechSynthesis.speak(announce);
    });

    // รีเซ็ตหน้าจอ
    socket.on("reset_done", function() {
        queueElement.innerText = "--";
    });

    // โหลดเสียงเตรียมไว้ให้พร้อม
    window.speechSynthesis.onvoiceschanged = function() {
        findThaiFemaleVoice();
    };
</script>
</body>
</html>
