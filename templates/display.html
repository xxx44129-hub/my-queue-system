<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Queue Display</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Queue Display">
<link rel="apple-touch-icon" href="/static/icon-512.png">

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #2c5364);
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}
.container { text-align: center; }
.queue {
    font-size: 240px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0 10px 20px rgba(0,0,0,0.5);
    animation: pop 0.4s ease-out;
}
.subtitle { font-size: 42px; margin-top: 20px; }

@keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

/* ปุ่มปลดล็อกเสียงสำหรับเบราว์เซอร์ (iPhone/Chrome) */
#unlock {
    position: fixed;
    inset: 0;
    background: black;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    z-index: 9999;
    text-align: center;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="unlock">แตะหน้าจอหนึ่งครั้ง<br>เพื่อเริ่มระบบเสียง</div>

<div class="container">
    <div class="queue" id="queue">--</div>
    <div class="subtitle">เมนูที่สั่งได้แล้วค่ะ</div>
</div>

<script>
/* =======================
   เริ่มต้นการทำงาน
======================= */
const socket = io();
const queueEl = document.getElementById("queue");
const unlock = document.getElementById("unlock");
let unlocked = false;

/* =======================
   ระบบเสียง (Web Speech API)
   🎯 แก้ไข: บังคับเสียงผู้หญิงไทยทุกระบบ, พูดช้าลง 0.65
======================= */
function getBestFemaleThaiVoice() {
    const voices = window.speechSynthesis.getVoices();
    
    // รายชื่อเสียงผู้หญิงไทยจากค่ายต่างๆ (Apple, Microsoft, Google)
    const femaleKeywords = ['Kanya', 'Narisa', 'Pattara', 'Female', 'Google ภาษาไทย', 'Premium', 'Microsoft Premere'];
    
    // กรองเอาเฉพาะภาษาไทย
    const thaiVoices = voices.filter(v => v.lang.startsWith('th'));

    // ค้นหาตามลำดับความนุ่มนวล
    for (let kw of femaleKeywords) {
        let found = thaiVoices.find(v => v.name.includes(kw));
        if (found) return found;
    }

    // ถ้าไม่เจอตามชื่อ ให้เอาเสียงภาษาไทยอันสุดท้ายที่มีในเครื่อง (มักเป็นเสียงคุณภาพสูง)
    return thaiVoices.length > 0 ? thaiVoices[thaiVoices.length - 1] : null;
}

function speak(text) {
    if (!unlocked) return;

    // หยุดเสียงเก่าทันทีเพื่อไม่ให้พูดซ้อนกัน
    window.speechSynthesis.cancel();

    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'th-TH';
    msg.rate = 0.65; // 🎯 ปรับให้พูดช้าลงตามที่มึงสั่ง
    msg.pitch = 1.1;  // ปรับโทนให้ดูเป็นผู้หญิงและสุภาพขึ้น

    const selectedVoice = getBestFemaleThaiVoice();
    if (selectedVoice) {
        msg.voice = selectedVoice;
    }

    window.speechSynthesis.speak(msg);
}

// โหลดรายการเสียงเตรียมไว้สำหรับเบราว์เซอร์ที่โหลดช้า
if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

unlock.addEventListener("click", () => {
    unlocked = true;
    unlock.style.display = "none";
    speak("เริ่มระบบค่ะ");
});

/* =======================
   Socket.IO Events (รับสัญญาณจาก app.py)
======================= */

// เรียกคิว (เลขเปลี่ยนพร้อมเสียงพูด)
socket.on("call_queue", data => {
    // อัปเดตตัวเลข
    queueEl.innerText = data.queue;
    
    // รีเซ็ตแอนิเมชั่น
    queueEl.style.animation = "none";
    queueEl.offsetHeight; 
    queueEl.style.animation = "pop 0.4s ease-out";

    // สั่งพูด (รหัสคิว)
    speak(data.msg);
});

// ข้ามออร์เดอร์ หรือแจ้งเตือน (พูดอย่างเดียว)
socket.on("speak_only", data => {
    speak(data.msg);
});

// อัปเดตหน้าจอทั่วไป (เช่น Reset หรือเปลี่ยนเลขจากเครื่องอื่น)
socket.on("queue_updated", data => {
    if (data.current) {
        queueEl.innerText = data.current;
        if (data.current !== "--") {
            queueEl.style.animation = "none";
            queueEl.offsetHeight;
            queueEl.style.animation = "pop 0.4s ease-out";
        }
    }
});
</script>

</body>
</html>
