<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Queue Display</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Queue Display">
<link rel="apple-touch-icon" href="/static/icon-512.png">

<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #2c5364);
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}
.container { text-align: center; }
.queue {
    font-size: 240px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0 10px 20px rgba(0,0,0,0.5);
    animation: pop 0.4s ease-out;
}
.subtitle { font-size: 42px; margin-top: 20px; }

@keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

#unlock {
    position: fixed;
    inset: 0;
    background: black;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    z-index: 9999;
    text-align: center;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="unlock">แตะหน้าจอหนึ่งครั้ง<br>เพื่อเริ่มระบบเสียง</div>

<div class="container">
    <div class="queue" id="queue">--</div>
    <div class="subtitle">เมนูที่สั่งได้แล้วค่ะ</div>
</div>

<script>
const socket = io();
const queueEl = document.getElementById("queue");
const unlock = document.getElementById("unlock");
let unlocked = false;

/* =======================
   ระบบเลือกเสียงผู้หญิงแบบบังคับเจาะจง
======================= */
function getBestFemaleThaiVoice() {
    const voices = window.speechSynthesis.getVoices();
    // เรียงลำดับความเพราะ: Google (ผู้หญิง) -> Kanya (iOS) -> Narisa (iOS) -> Pattara (Windows)
    const femaleKeywords = ['Google ภาษาไทย', 'Kanya', 'Narisa', 'Pattara', 'Female', 'Premium', 'Microsoft Premere'];
    const thaiVoices = voices.filter(v => v.lang.startsWith('th'));

    for (let kw of femaleKeywords) {
        let found = thaiVoices.find(v => v.name.includes(kw));
        if (found) return found;
    }
    // ถ้าไม่เจอตามชื่อ ให้เอาอันที่มีคำว่า "Female" หรือถ้าไม่มีจริงๆ เอาอันสุดท้ายในลิสต์ภาษาไทย
    return thaiVoices.length > 0 ? thaiVoices[thaiVoices.length - 1] : null;
}

function speak(text) {
    if (!unlocked) return;

    // หยุดเสียงเก่าก่อนเริ่มใหม่
    window.speechSynthesis.cancel();

    // สร้างคำพูดใหม่
    const speakTask = () => {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'th-TH';
        msg.rate = 0.6;   // 🎯 ปรับให้ช้าลงมาก (จาก 0.65 เป็น 0.6) เพื่อความชัดเจน
        msg.pitch = 1.1;  // ปรับโทนแหลมขึ้นนิดหน่อยให้เป็นเสียงผู้หญิง

        const selectedVoice = getBestFemaleThaiVoice();
        if (selectedVoice) {
            msg.voice = selectedVoice;
            console.log("ใช้เสียง:", selectedVoice.name);
        } else {
            console.log("ยังหาเสียงผู้หญิงไม่เจอ กำลังรอ...");
        }

        window.speechSynthesis.speak(msg);
    };

    // ป้องกันกรณีรายการเสียงยังไม่ถูกโหลด
    if (window.speechSynthesis.getVoices().length === 0) {
        window.speechSynthesis.onvoiceschanged = speakTask;
    } else {
        speakTask();
    }
}

// โหลดเสียงล่วงหน้าทันทีที่เปิดเว็บ
window.speechSynthesis.getVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

unlock.addEventListener("click", () => {
    unlocked = true;
    unlock.style.display = "none";
    speak("เริ่มระบบค่ะ");
});

/* =======================
   Socket.IO Events
======================= */
socket.on("call_queue", data => {
    queueEl.innerText = data.queue;
    queueEl.style.animation = "none";
    queueEl.offsetHeight; 
    queueEl.style.animation = "pop 0.4s ease-out";
    speak(data.msg);
});

socket.on("speak_only", data => {
    speak(data.msg);
});

socket.on("queue_updated", data => {
    if (data.current) {
        queueEl.innerText = data.current;
        if (data.current !== "--") {
            queueEl.style.animation = "none";
            queueEl.offsetHeight;
            queueEl.style.animation = "pop 0.4s ease-out";
        }
    }
});
</script>

</body>
</html>
