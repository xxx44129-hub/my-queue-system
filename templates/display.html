<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>Queue Display</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Queue Display">

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #2c5364);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container { text-align: center; }

        .queue {
            font-size: clamp(96px, 22vw, 240px);
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .subtitle {
            font-size: clamp(24px, 5vw, 48px);
            margin-top: 20px;
            color: #e0e0e0;
            letter-spacing: 2px;
        }

        /* หน้ากากสำหรับปลดล็อกเสียงในครั้งแรกที่เปิดหน้าจอ */
        #unlock {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.01);
            z-index: 9999;
            cursor: pointer;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); color: #fff; }
            100% { transform: scale(1); }
        }
    </style>
</head>

<body>

<div id="unlock"></div>

<div class="container">
    <div class="queue" id="queue">--</div>
    <div class="subtitle">เมนูที่สั่งได้แล้วค่ะ</div>
</div>

<script>
    const socket = io();
    const queueEl = document.getElementById("queue");
    const unlock = document.getElementById("unlock");
    let unlocked = false;

    // ฟังก์ชันหาเสียงภาษาไทย
    function getBestThaiVoice() {
        const voices = window.speechSynthesis.getVoices();
        return voices.find(v => v.lang.startsWith('th')) || null;
    }

    // ฟังก์ชันพูดสำหรับหน้า Display
    function speak(text) {
        if (!unlocked) return;

        window.speechSynthesis.cancel(); // หยุดเสียงเก่าก่อนพูดใหม่

        // ปรับแต่งคำพูดให้อ่านแยกเลข
        let rawDigits = text.replace("Q", "");
        let separatedDigits = rawDigits.split("").join(" ");
        let finalMessage = "คิว " + separatedDigits + " เมนูที่สั่งได้แล้วค่ะ";

        const msg = new SpeechSynthesisUtterance(finalMessage);
        msg.lang = 'th-TH';
        msg.rate = 0.8; // ความเร็วปกติ
        msg.pitch = 1.0;

        const voice = getBestThaiVoice();
        if (voice) msg.voice = voice;

        window.speechSynthesis.speak(msg);
    }

    // ปลดล็อกระบบเสียงเมื่อคลิกที่ใดก็ได้ในหน้าจอครั้งแรก
    unlock.addEventListener("click", () => {
        unlocked = true;
        unlock.style.display = "none";
        // ทดสอบพูดสั้นๆ เพื่อเปิดทางให้ Browser
        const testMsg = new SpeechSynthesisUtterance("เริ่มระบบค่ะ");
        testMsg.lang = 'th-TH';
        window.speechSynthesis.speak(testMsg);
        console.log("Display Audio Unlocked");
    });

    // โหลดเสียงเตรียมไว้
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

    /* --- Socket Events --- */
    
    // เมื่อมีการเรียกคิว (ทั้ง Next, Set หรือ Again)
    socket.on("call_queue", data => {
        queueEl.innerText = data.queue;
        
        // ใส่ Animation กระเด้ง
        queueEl.style.animation = "none";
        queueEl.offsetHeight; 
        queueEl.style.animation = "pop 0.4s ease-out";
        
        // พูดเสมอเมื่อมีคิวมา
        speak(data.queue);
    });

    // สำหรับเสียงแจ้งเตือนอื่นๆ เช่น ข้ามออเดอร์
    socket.on("speak_only", data => {
        speak(data.msg);
    });

    // อัปเดตเลขหน้าจอเฉยๆ (ถ้ามี)
    socket.on("queue_updated", data => {
        if (data.current) {
            queueEl.innerText = data.current;
        }
    });

    // เมื่อมีการรีเซ็ต
    socket.on("reset_done", () => {
        queueEl.innerText = "--";
    });
</script>
</body>
</html>
