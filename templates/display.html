<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>Queue Display System</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #2c5364, #203a43);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container { text-align: center; }

        .queue-label {
            font-size: 50px;
            color: #e0e0e0;
            margin-bottom: -10px;
            font-weight: 300;
        }

        .queue {
            font-size: clamp(120px, 30vw, 280px);
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 15px 30px rgba(0,0,0,0.6);
            margin: 0;
        }

        .subtitle {
            font-size: clamp(24px, 6vw, 50px);
            margin-top: 30px;
            color: #ffffff;
            letter-spacing: 3px;
            font-weight: 400;
        }

        /* หน้ากากปลดล็อกเสียงสำหรับ iOS */
        #unlock-screen {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
        }

        .unlock-button {
            padding: 25px 50px;
            background: #ffd700;
            color: black;
            font-size: 30px;
            font-weight: bold;
            border-radius: 60px;
            box-shadow: 0 0 30px rgba(255,215,0,0.4);
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); color: #fff; }
            100% { transform: scale(1); }
        }
        .animate-pop { animation: pop 0.5s ease-out; }
    </style>
</head>
<body>

<div id="unlock-screen" onclick="handleUnlockAudio()">
    <div class="unlock-button">แตะหน้าจอเพื่อเริ่มระบบเสียง</div>
    <p style="margin-top: 20px; font-size: 18px; color: #ccc;">(จำเป็นสำหรับ iPhone/iPad)</p>
</div>

<div class="container">
    <div class="queue-label">หมายเลขคิว</div>
    <div class="queue" id="queue-display">--</div>
    <div class="subtitle">เมนูที่สั่งได้แล้วค่ะ</div>
</div>

<script>
    const socket = io();
    const queueElement = document.getElementById("queue-display");
    const unlockScreen = document.getElementById("unlock-screen");
    
    // ดึงไฟล์เสียง Beep
    const beepAudio = new Audio("/static/beep.mp3");
    let isAudioUnlocked = false;

    // ค้นหาเสียงผู้หญิงไทย
    function findThaiFemaleVoice() {
        const voices = window.speechSynthesis.getVoices();
        return voices.find(v => v.lang.includes('th') && (v.name.includes('Kanya') || v.name.includes('Narisa') || v.name.includes('Female'))) 
               || voices.find(v => v.lang.includes('th'));
    }

    // ฟังก์ชันปลดล็อก (User Gesture)
    function handleUnlockAudio() {
        isAudioUnlocked = true;
        unlockScreen.style.display = "none";
        
        // ทดสอบเล่นเสียงสั้นๆ เพื่อเปิดทางลำโพง iPhone
        beepAudio.play().then(() => {
            beepAudio.pause();
            beepAudio.currentTime = 0;
        });
        
        const welcome = new SpeechSynthesisUtterance("ระบบพร้อมใช้งานค่ะ");
        welcome.lang = 'th-TH';
        window.speechSynthesis.speak(welcome);
    }

    // ฟังก์ชันพูดที่แก้บั๊ก iPhone และเว้นช่วงเสียงกระดิ่ง
    function playQueueVoice(queueText) {
        if (!isAudioUnlocked) return;

        // เคลียร์เสียงที่ค้างอยู่
        window.speechSynthesis.cancel();

        // จัดรูปแบบเลขคิวแยกหลัก
        let digits = queueText.replace("Q", "").split("").join(" ");
        
        // 🎯 เพิ่มคอมม่า ( , ) เพื่อเว้นจังหวะให้ beep เล่นจบก่อน
        // ถ้ากระดิ่งมึงยาวมาก ให้เติมคอมม่าเข้าไปอีกได้
        const msg = new SpeechSynthesisUtterance(", , , , , , , คิว " + digits);
        msg.lang = 'th-TH';
        msg.rate = 0.9; // ความเร็วปกติ
        
        const voice = findThaiFemaleVoice();
        if (voice) msg.voice = voice;

        // สั่งทำงานพร้อมกัน (Sync) เพื่อให้ iPhone ไม่บล็อกเสียงพูด
        beepAudio.play().catch(e => console.log("Beep error:", e));
        window.speechSynthesis.speak(msg);
    }

    /* --- Socket Events --- */

    // รับสัญญาณเรียกคิว
    socket.on("call_queue_display", function(data) {
        let q = data.queue;
        queueElement.innerText = q;
        
        // อนิเมชั่นตัวเลขเด้ง
        queueElement.classList.remove("animate-pop");
        void queueElement.offsetWidth; 
        queueElement.classList.add("animate-pop");
        
        playQueueVoice(q);
    });

    // รับสัญญาณประกาศอื่นๆ (เช่น ข้ามออเดอร์)
    socket.on("speak_only", function(data) {
        if (!isAudioUnlocked) return;
        window.speechSynthesis.cancel();
        
        const msg = new SpeechSynthesisUtterance(", , , , , , , " + data.msg);
        msg.lang = 'th-TH';
        const voice = findThaiFemaleVoice();
        if (voice) msg.voice = voice;
        
        beepAudio.play().catch(e => console.log("Beep error:", e));
        window.speechSynthesis.speak(msg);
    });

    // อัปเดตตัวเลขหน้าจอปกติ
    socket.on("queue_updated", data => {
        if (data.current) queueElement.innerText = data.current;
    });

    // รีเซ็ตคิว
    socket.on("reset_done", () => {
        queueElement.innerText = "--";
    });

    // โหลดเสียงเตรียมไว้
    window.speechSynthesis.onvoiceschanged = findThaiFemaleVoice;
</script>
</body>
</html>
