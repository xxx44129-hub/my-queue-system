<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>Queue Display</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #2c5364);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container { text-align: center; }

        .queue {
            font-size: clamp(96px, 22vw, 240px);
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: clamp(24px, 5vw, 48px);
            margin-top: 20px;
            color: #e0e0e0;
            letter-spacing: 2px;
        }

        /* หน้ากากปลดล็อกเสียงสำหรับ iPhone/iPad */
        #unlock {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.01);
            z-index: 9999;
            cursor: pointer;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); color: #fff; }
            100% { transform: scale(1); }
        }
    </style>
</head>

<body>

<div id="unlock"></div>

<div class="container">
    <div class="queue" id="queue">--</div>
    <div class="subtitle">เมนูที่สั่งได้แล้วค่ะ</div>
</div>

<script>
    const socket = io();
    const queueEl = document.getElementById("queue");
    let unlocked = false;

    // ฟังก์ชันเลือกเสียงผู้หญิงไทยให้ iPhone
    function getFemaleVoice() {
        const voices = window.speechSynthesis.getVoices();
        return voices.find(v => v.lang.includes('th') && (v.name.includes('Kanya') || v.name.includes('Narisa') || v.name.includes('Female'))) || 
               voices.find(v => v.lang.includes('th'));
    }

    function speak(text) {
        if (!unlocked) return;
        window.speechSynthesis.cancel(); // ล้างคิวเสียงเก่าทิ้งทันที

        // 🎯 แก้ตามสั่ง: พูดแค่ "คิว" + เลขแยกหลัก (เช่น คิว ศูนย์ ศูนย์ หนึ่ง)
        let digits = text.replace("Q", "").split("").join(" ");
        let finalMessage = "คิว " + digits;

        const msg = new SpeechSynthesisUtterance(finalMessage);
        msg.lang = 'th-TH';
        msg.rate = 0.9; // ความเร็วระดับปกติ
        msg.pitch = 1.1; // ปรับโทนแหลมนิดๆ ให้เป็นเสียงผู้หญิงชัดขึ้น

        const voice = getFemaleVoice();
        if (voice) msg.voice = voice;

        window.speechSynthesis.speak(msg);
    }

    // ปลดล็อกเสียงเมื่อจิ้มหน้าจอครั้งแรก (สำคัญมากสำหรับ iOS)
    document.getElementById("unlock").addEventListener("click", function() {
        unlocked = true;
        this.style.display = "none";
        const startMsg = new SpeechSynthesisUtterance("เริ่มระบบค่ะ");
        startMsg.lang = 'th-TH';
        window.speechSynthesis.speak(startMsg);
    });

    window.speechSynthesis.onvoiceschanged = getFemaleVoice;

    /* --- Socket Events --- */

    // รับสัญญาณเรียกคิว (กรณีปิดเสียงหน้า Counter)
    socket.on("call_queue_display", data => {
        queueEl.innerText = data.queue;
        
        // ใส่ Animation ให้ตัวเลขเด้ง
        queueEl.style.animation = "none";
        queueEl.offsetHeight; 
        queueEl.style.animation = "pop 0.4s ease-out";
        
        speak(data.queue);
    });

    // อัปเดตตัวเลขหน้าจอเฉยๆ (Sync ข้อมูล)
    socket.on("queue_updated", data => {
        if (data.current) {
            queueEl.innerText = data.current;
        }
    });

    // เสียงแจ้งเตือนอื่นๆ เช่น ข้ามออเดอร์
    socket.on("speak_only", data => {
        if (!unlocked) return;
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(data.msg);
        msg.lang = 'th-TH';
        const voice = getFemaleVoice();
        if (voice) msg.voice = voice;
        window.speechSynthesis.speak(msg);
    });

    socket.on("reset_done", () => {
        queueEl.innerText = "--";
    });
</script>
</body>
</html>
