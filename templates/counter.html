<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>Queue Counter Control</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        /* CSS ดีไซน์เต็มรูปแบบ กูคงเดิมไว้ให้ 100% */
        body {
            margin: 0;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .panel {
            background: #ffffff;
            width: 550px;
            max-width: 92vw;
            border-radius: 22px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12), 0 6px 16px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 { margin-top: 0; margin-bottom: 10px; font-size: 26px; color: #1e293b; font-weight: 700; }
        .current {
            font-size: 110px;
            font-weight: 800;
            color: #2563eb;
            margin: 20px 0 10px;
            letter-spacing: 2px;
        }
        .info { font-size: 18px; color: #475569; margin-bottom: 22px; }
        #setQueue {
            font-size: 22px;
            padding: 14px;
            width: 80%;
            max-width: 360px;
            text-align: center;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            outline: none;
            transition: all 0.2s;
        }
        #setQueue:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 10px;
        }
        button {
            font-size: 20px;
            padding: 18px 12px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            color: white;
            transition: transform 0.08s ease;
        }
        button:active { transform: scale(0.97); }
        .next { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .skip { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .again { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
        .reset { background: linear-gradient(135deg, #ef4444, #dc2626); }
        
        .voice-control {
            margin-top: 22px;
            padding: 14px;
            background: #f1f5f9;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 15px;
            color: #334155;
        }
    </style>
</head>
<body>

<div class="panel">
    <h1>ระบบควบคุมคิว</h1>
    <div class="current" id="current">--</div>
    <div class="info">คิวล่าสุดในระบบ: <b id="last">--</b></div>

    <input id="setQueue" type="text" pattern="\d*" placeholder="กรอกเลข เช่น 001">
    <br><br>
    <button style="background:#8e44ad; color:white; padding:12px 30px; border-radius:10px;" onclick="handleManualSet()">ตั้งค่าคิว/เรียกเลขนี้</button>

    <div class="voice-control">
        <span><b>เปิดเล่นเสียงที่หน้าจอนี้:</b></span>
        <input type="checkbox" id="voiceToggle" style="width:22px; height:22px;">
    </div>

    <div class="buttons">
        <button class="next" onclick="handleNextQueue()">เรียกคิวถัดไป</button>
        <button class="skip" onclick="handleSkipOrder()">ข้าม ออเดอร์</button>
        <button class="again" onclick="handleCallAgain()">เรียกซ้ำคิวบนจอ</button>
        <button class="reset" onclick="handleResetSystem()">รีเซ็ตทั้งหมด</button>
    </div>
</div>

<script>
    const socket = io();
    const currentEl = document.getElementById("current");
    const lastEl = document.getElementById("last");
    const inputEl = document.getElementById("setQueue");
    const voiceToggle = document.getElementById("voiceToggle");
    
    // โหลดไฟล์เสียง Beep จาก static
    const beepAudio = new Audio("/static/beep.mp3");
    let audioUnlocked = false;

    // ฟังก์ชันดึงเสียงผู้หญิงไทย
    function getFemaleVoice() {
        const voices = window.speechSynthesis.getVoices();
        let thaiVoice = voices.find(v => v.lang.includes('th') && (v.name.includes('Kanya') || v.name.includes('Narisa') || v.name.includes('Female')));
        if (!thaiVoice) {
            thaiVoice = voices.find(v => v.lang.includes('th'));
        }
        return thaiVoice;
    }

    // ปลดล็อกเสียง (ต้องรันตอนกดปุ่มเพื่อให้ iPhone ยอมให้เล่นเสียง)
    function unlockAudio() {
        if (!audioUnlocked) {
            // เล่น Beep สั้นๆ เพื่อปลดล็อกลำโพง
            beepAudio.play().then(() => {
                beepAudio.pause();
                beepAudio.currentTime = 0;
            }).catch(e => console.log("Unlock failed"));
            audioUnlocked = true;
        }
    }

    // ฟังก์ชันพูดสำหรับเครื่อง Counter (มี Beep นำ)
    function speakLocally(text, isDirectMsg = false) {
        if (!voiceToggle.checked) return;
        window.speechSynthesis.cancel();
        
        beepAudio.play().then(() => {
            setTimeout(() => {
                let finalSpeech = text;
                if (!isDirectMsg) {
                    let digits = text.replace("Q", "").split("").join(" ");
                    finalSpeech = "คิว " + digits;
                }
                
                const msg = new SpeechSynthesisUtterance(finalSpeech);
                msg.lang = 'th-TH';
                msg.rate = 0.9;
                const voice = getFemaleVoice();
                if (voice) msg.voice = voice;
                window.speechSynthesis.speak(msg);
            }, 800); // รอ Beep 0.8 วิ
        });
    }

    // --- ฟังก์ชันจัดการปุ่มกด ---

    function handleNextQueue() {
        unlockAudio();
        let currentText = currentEl.innerText;
        let currentNum = 0;
        if (currentText !== "--" && currentText !== "") {
            currentNum = parseInt(currentText.replace("Q", ""));
        }
        let nextQ = "Q" + String(currentNum + 1).padStart(3, '0');
        socket.emit("set_queue", { queue: nextQ, voice_on_counter: voiceToggle.checked });
    }

    function handleManualSet() {
        unlockAudio();
        let val = inputEl.value.trim();
        if (val === "") return;
        let formattedQ = "Q" + val.padStart(3, '0');
        socket.emit("set_queue", { queue: formattedQ, voice_on_counter: voiceToggle.checked });
        inputEl.value = "";
    }

    function handleCallAgain() {
        unlockAudio();
        let currentQ = currentEl.innerText;
        if (currentQ !== "--") {
            socket.emit("set_queue", { queue: currentQ, voice_on_counter: voiceToggle.checked });
        }
    }

    function handleSkipOrder() {
        unlockAudio();
        socket.emit('skip_order', { voice_on_counter: voiceToggle.checked });
    }

    function handleResetSystem() {
        if (confirm("ต้องการรีเซ็ตคิวทั้งหมดเป็น 0?")) {
            socket.emit('reset');
        }
    }

    // --- Socket Events ---

    socket.on("call_queue_locally", data => {
        speakLocally(data.queue, false);
    });

    socket.on("speak_locally", data => {
        speakLocally(data.msg, true);
    });

    socket.on("queue_updated", data => {
        currentEl.innerText = data.current;
        lastEl.innerText = data.last;
    });

    socket.on("reset_done", () => {
        currentEl.innerText = "--";
        lastEl.innerText = "--";
    });

    window.speechSynthesis.onvoiceschanged = getFemaleVoice;
</script>
</body>
</html>
