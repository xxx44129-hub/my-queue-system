<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Queue Counter (Voice Control)</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
    body {
        margin: 0;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .panel {
        background: #ffffff;
        width: 550px;
        max-width: 92vw;
        border-radius: 22px;
        padding: 32px 28px;
        box-shadow:
            0 20px 40px rgba(0,0,0,0.12),
            0 6px 16px rgba(0,0,0,0.08);
        text-align: center;
    }

    h1 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 26px;
        color: #1e293b;
        font-weight: 700;
    }

    .current {
        font-size: clamp(72px, 18vw, 110px);
        font-weight: 800;
        color: #2563eb;
        margin: 20px 0 10px;
        letter-spacing: 2px;
    }

    .info {
        font-size: 18px;
        color: #475569;
        margin-bottom: 22px;
    }

    #setQueue {
        font-size: 22px;
        padding: 14px;
        width: 80%;
        max-width: 360px;
        text-align: center;
        border-radius: 12px;
        border: 1px solid #cbd5e1;
    }

    .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 10px;
    }

    button {
        font-size: 20px;
        padding: 18px 12px;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        font-weight: 700;
        color: white;
        -webkit-tap-highlight-color: transparent;
    }

    .next {
        grid-column: span 2;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        font-size: 22px;
    }

    .skip {
        background: linear-gradient(135deg, #f59e0b, #d97706);
    }

    .again {
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
    }

    .reset {
        background: linear-gradient(135deg, #ef4444, #dc2626);
    }

    .voice-control {
        margin-top: 22px;
        padding: 14px;
        background: #f1f5f9;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 15px;
        color: #334155;
    }

    .switch {
        position: relative;
        display: inline-block;
        width: 56px;
        height: 32px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #cbd5e1;
        border-radius: 32px;
    }

    .slider:before {
        position: absolute;
        content: "";
        height: 24px;
        width: 24px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        border-radius: 50%;
    }

    input:checked + .slider {
        background-color: #2563eb;
    }

    input:checked + .slider:before {
        transform: translateX(24px);
    }
</style>
</head>

<body>
<div class="panel">
    <h1>ระบบควบคุมคิว</h1>
    <div class="current" id="current">--</div>
    <div class="info">คิวล่าสุด: <b id="last">--</b></div>

    <input id="setQueue" type="text" pattern="\d*" placeholder="กรอกเลขคิว เช่น 002">
    <br><br>

    <button style="background:#8e44ad;color:white;padding:12px 30px;border-radius:10px;"
        onclick="handleSetQueue()">ตั้งค่าคิว</button>

    <div class="voice-control">
        <span><b>เปิดเสียงที่หน้าจอนี้:</b></span>
        <label class="switch">
            <input type="checkbox" id="voiceToggle">
            <span class="slider"></span>
        </label>
    </div>

    <br>

    <div class="buttons">
        <!-- ปุ่มหลัก เหลือปุ่มเดียว -->
        <button class="next" onclick="handleNext()">เรียกคิวถัดไป</button>

        <button class="skip" onclick="handleSkip()">ข้าม Order</button>
        <button class="again" onclick="handleAgainBtn()">เรียกซ้ำ/คิวที่กรอก</button>
        <button class="reset" onclick="handleReset()">รีเซ็ต</button>
    </div>
</div>

<script>
const socket = io();
const currentEl = document.getElementById("current");
const lastEl = document.getElementById("last");
const inputEl = document.getElementById("setQueue");
const voiceToggle = document.getElementById("voiceToggle");
let audioUnlocked = false;

function unlockAudio() {
    if (audioUnlocked) return;
    window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
    audioUnlocked = true;
}

function handleNext() {
    unlockAudio();

    let currentStr = currentEl.innerText;
    let nextNum = 1;

    if (currentStr !== "--") {
        nextNum = parseInt(currentStr.substring(1)) + 1;
    }

    const nextQ = "Q" + String(nextNum).padStart(3, '0');
    currentEl.innerText = nextQ;

    socket.emit('call_next');
}

function handleSkip() { unlockAudio(); socket.emit('skip_order'); }

function handleAgainBtn() {
    unlockAudio();
    let val = inputEl.value.trim().toUpperCase();
    if (val !== "") {
        if (!val.startsWith("Q")) val = "Q" + val.padStart(3, '0');
        socket.emit("set_queue", { queue: val });
        inputEl.value = "";
    } else {
        socket.emit('call_again');
    }
}

function handleSetQueue() {
    unlockAudio();
    let val = inputEl.value.trim().toUpperCase();
    if (val === "") return;
    if (!val.startsWith("Q")) val = "Q" + val.padStart(3, '0');
    socket.emit("set_queue", { queue: val });
    inputEl.value = "";
}

function handleReset() {
    unlockAudio();
    if (confirm("ต้องการล้างคิวทั้งหมดใช่ไหม?")) {
        socket.emit('reset');
    }
}

socket.on("call_queue", data => {
    currentEl.innerText = data.queue;
});

socket.on("queue_updated", data => {
    lastEl.innerText = data.last;
    currentEl.innerText = data.current;
});
</script>
</body>
</html>
