<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Queue Counter</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #f4f6f9;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
.panel {
    background: white;
    width: 550px;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
}
.current {
    font-size: 96px;
    font-weight: bold;
    color: #2a5298;
    margin: 20px 0;
}
.info {
    font-size: 18px;
    color: #555;
    margin-bottom: 20px;
}
.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}
button {
    font-size: 20px;
    padding: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
}
.new { background: #27ae60; color: white; }
.next { background: #2980b9; color: white; }
.skip { background: #e67e22; color: white; }
.again { background: #f39c12; color: white; }
.reset { background: #c0392b; color: white; }
</style>
</head>

<body>
<div class="panel">
    <h1>ระบบควบคุมคิว</h1>

    <div class="current" id="current">--</div>
    <div class="info">คิวล่าสุด: <b id="last">--</b></div>

    <!-- ตั้งค่าคิว -->
    <input id="setQueue" placeholder="กรอกคิว เช่น Q002"
        style="font-size:22px;padding:12px;width:80%;text-align:center;border-radius:10px;border:1px solid #ccc;">
    <br><br>
    <button style="background:#8e44ad;color:white;padding:12px 30px;border-radius:10px;"
        onclick="setQueue()">ตั้งค่าคิว</button>

    <br><br>

    <div class="buttons">
        <button class="new" onclick="socket.emit('new_queue')">รับคิวใหม่</button>
        <button class="next" onclick="socket.emit('call_next')">เรียกคิวถัดไป</button>
        <button class="skip" onclick="socket.emit('skip_order')">ข้าม Order</button>
        <button class="again" onclick="socket.emit('call_again')">เรียกซ้ำ/คิวที่กรอก</button>
        <button class="reset" onclick="socket.emit('reset')">รีเซ็ต</button>
    </div>
</div>

<script>
const socket = io();

function setQueue() {
    const value = document.getElementById("setQueue").value.trim().toUpperCase();
    if (!/^Q\d{3}$/.test(value)) {
        alert("กรุณากรอก Q001 - Q500");
        return;
    }
    const num = parseInt(value.substring(1));
    if (num < 1 || num > 500) {
        alert("คิวต้องอยู่ระหว่าง Q001 ถึง Q500");
        return;
    }
    socket.emit("set_queue", { queue: value });
}

socket.on("queue_updated", data => {
    document.getElementById("last").innerText = data.last;
    document.getElementById("current").innerText = data.current;
});

socket.on("call_queue", data => {
    document.getElementById("current").innerText = data.queue;
});
</script>
</body>
</html>
