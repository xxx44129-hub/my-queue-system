<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Queue Counter</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #f4f6f9;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
.panel {
    background: white;
    width: 550px;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
}
.current {
    font-size: 96px;
    font-weight: bold;
    color: #2a5298;
    margin: 20px 0;
}
.info {
    font-size: 18px;
    color: #555;
    margin-bottom: 20px;
}
.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}
button {
    font-size: 20px;
    padding: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
}
.new { background: #27ae60; color: white; }
.next { background: #2980b9; color: white; }
.skip { background: #e67e22; color: white; }
.again { background: #f39c12; color: white; }
.reset { background: #c0392b; color: white; }
</style>
</head>

<body>
<div class="panel">
    <h1>ระบบควบคุมคิว</h1>

    <div class="current" id="current">--</div>
    <div class="info">คิวล่าสุด: <b id="last">--</b></div>

    <input id="setQueue" placeholder="กรอกคิว เช่น Q002"
        style="font-size:22px;padding:12px;width:80%;text-align:center;border-radius:10px;border:1px solid #ccc;">
    <br><br>
    <button style="background:#8e44ad;color:white;padding:12px 30px;border-radius:10px;"
        onclick="handleSetQueue()">ตั้งค่าคิว</button>

    <br><br>

    <div class="buttons">
        <button class="new" onclick="socket.emit('new_queue')">รับคิวใหม่</button>
        <button class="next" onclick="handleCallNext()">เรียกคิวถัดไป</button>
        <button class="skip" onclick="socket.emit('skip_order')">ข้าม Order</button>
        <button class="again" onclick="handleAgain()">เรียกซ้ำ/คิวที่กรอก</button>
        <button class="reset" onclick="handleReset()">รีเซ็ต</button>
    </div>
</div>

<script>
const socket = io();
const currentEl = document.getElementById("current");
const lastEl = document.getElementById("last");
const inputEl = document.getElementById("setQueue");

/* ==================================
   1. ฟังก์ชันเรียกคิวถัดไป (แก้เลขไม่ขึ้น)
   ================================== */
function handleCallNext() {
    const lastStr = lastEl.innerText;
    const currentStr = currentEl.innerText;

    // ถ้าคิวปัจจุบันยังไม่ถึงคิวล่าสุด ให้เลขขยับหลอกรอไว้เลย (Optimistic UI)
    if (lastStr !== "--") {
        const lastNum = parseInt(lastStr.substring(1));
        const currentNum = currentStr === "--" ? 0 : parseInt(currentStr.substring(1));

        if (currentNum < lastNum) {
            const nextQ = "Q" + String(currentNum + 1).padStart(3, '0');
            currentEl.innerText = nextQ; // เลขเปลี่ยนทันทีที่กด!
        }
    }
    socket.emit('call_next');
}

/* ==================================
   2. ฟังก์ชันเรียกซ้ำ หรือ เรียกคิวที่กรอก
   ================================== */
function handleAgain() {
    const value = inputEl.value.trim().toUpperCase();
    if (value !== "" && /^Q\d{3}$/.test(value)) {
        // ถ้ามึงกรอกเลขไว้ ให้มันเรียกเลขนั้นเลย (ซ่อมบัคปุ่มมั่ว)
        socket.emit("set_queue", { queue: value });
        inputEl.value = "";
    } else {
        // ถ้าไม่ได้กรอก ให้เรียกซ้ำตัวเดิม
        socket.emit('call_again');
    }
}

/* ==================================
   3. ฟังก์ชันตั้งค่าคิว (Set Queue)
   ================================== */
function handleSetQueue() {
    const value = inputEl.value.trim().toUpperCase();
    if (!/^Q\d{3}$/.test(value)) {
        alert("กรุณากรอก Q001 - Q500");
        return;
    }
    socket.emit("set_queue", { queue: value });
    inputEl.value = "";
}

/* ==================================
   4. ฟังก์ชันรีเซ็ต (ถามก่อนกันพลาด)
   ================================== */
function handleReset() {
    if (confirm("ต้องการล้างคิวทั้งหมดใช่ไหม?")) {
        socket.emit('reset');
    }
}

/* ==================================
   5. รับสัญญาณอัปเดตจาก Server
   ================================== */
socket.on("queue_updated", data => {
    // อัปเดตเลขจริงจาก Server เพื่อให้ทุกหน้าจอตรงกัน
    lastEl.innerText = data.last;
    currentEl.innerText = data.current;
});

// รับสัญญาณตอนกดเรียก (เพื่อให้เลขหน้า Counter ซิงค์กับหน้า Display)
socket.on("call_queue", data => {
    currentEl.innerText = data.queue;
});
</script>
</body>
</html>
