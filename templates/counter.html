<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>Queue Counter Control</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        /* CSS ดีไซน์จัดเต็ม ห้ามตัด! */
        body {
            margin: 0;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .panel {
            background: #ffffff;
            width: 550px;
            max-width: 92vw;
            border-radius: 22px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12), 0 6px 16px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 { margin-top: 0; margin-bottom: 10px; font-size: 26px; color: #1e293b; font-weight: 700; }
        .current {
            font-size: 110px;
            font-weight: 800;
            color: #2563eb;
            margin: 20px 0 10px;
            letter-spacing: 2px;
        }
        .info { font-size: 18px; color: #475569; margin-bottom: 22px; }
        #setQueue {
            font-size: 22px;
            padding: 14px;
            width: 80%;
            max-width: 360px;
            text-align: center;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            outline: none;
            transition: all 0.2s;
        }
        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 10px;
        }
        button {
            font-size: 20px;
            padding: 18px 12px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            color: white;
            transition: transform 0.08s ease;
        }
        button:active { transform: scale(0.97); }
        .next { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .skip { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .again { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
        .reset { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .voice-control {
            margin-top: 22px;
            padding: 14px;
            background: #f1f5f9;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
    </style>
</head>
<body>

<div class="panel">
    <h1>ระบบควบคุมคิว</h1>
    <div class="current" id="current">--</div>
    <div class="info">คิวล่าสุดในระบบ: <b id="last">--</b></div>

    <input id="setQueue" type="text" pattern="\d*" placeholder="กรอกเลข เช่น 001">
    <br><br>
    <button style="background:#8e44ad; color:white; padding:12px 30px; border-radius:10px;" onclick="handleManualSet()">ตั้งค่าคิว/เรียกเลขนี้</button>

    <div class="voice-control">
        <span><b>เปิดเล่นเสียงที่หน้าจอนี้:</b></span>
        <input type="checkbox" id="voiceToggle" style="width:22px; height:22px;">
    </div>

    <div class="buttons">
        <button class="next" onclick="handleNextQueue()">เรียกคิวถัดไป</button>
        <button class="skip" onclick="handleSkipOrder()">ข้าม ออเดอร์</button>
        <button class="again" onclick="handleCallAgain()">เรียกซ้ำคิวบนจอ</button>
        <button class="reset" onclick="handleResetSystem()">รีเซ็ตทั้งหมด</button>
    </div>
</div>

<script>
    const socket = io();
    const currentEl = document.getElementById("current");
    const lastEl = document.getElementById("last");
    const inputEl = document.getElementById("setQueue");
    const voiceToggle = document.getElementById("voiceToggle");
    
    const beepAudio = new Audio("/static/beep.mp3");
    let audioUnlocked = false;

    function getFemaleVoice() {
        const voices = window.speechSynthesis.getVoices();
        return voices.find(v => v.lang.includes('th') && (v.name.includes('Kanya') || v.name.includes('Narisa') || v.name.includes('Female'))) || voices.find(v => v.lang.includes('th'));
    }

    // ปลดล็อกเสียงสำหรับ iPhone
    function unlockAudio() {
        if (!audioUnlocked) {
            beepAudio.play().then(() => { beepAudio.pause(); beepAudio.currentTime = 0; });
            const silent = new SpeechSynthesisUtterance("");
            window.speechSynthesis.speak(silent);
            audioUnlocked = true;
        }
    }

    // ฟังก์ชันพูดที่แก้บั๊ก iPhone (กระดิ่ง + พูด พร้อมกัน)
    function speakLocally(text, isDirectMsg = false) {
        if (!voiceToggle.checked) return;
        
        window.speechSynthesis.cancel();
        
        let finalSpeech = text;
        if (!isDirectMsg) {
            let digits = text.replace("Q", "").split("").join(" ");
            // 🎯 ใส่คอมม่า ( , ) เยอะๆ เพื่อถ่างช่วงเวลาให้กระดิ่งจบก่อนพูด
            finalSpeech = ", , , , , , , , , , คิว " + digits;
        } else {
            finalSpeech = ", , , , , , , , , , " + text;
        }

        const msg = new SpeechSynthesisUtterance(finalSpeech);
        msg.lang = 'th-TH';
        msg.rate = 0.9;
        const voice = getFemaleVoice();
        if (voice) msg.voice = voice;

        // สั่งทำงานพร้อมกันเพื่อหลอกระบบ iPhone ให้ยอมปล่อยเสียง
        beepAudio.play().catch(e => console.log("Beep error"));
        window.speechSynthesis.speak(msg);
    }

    function handleNextQueue() {
        unlockAudio();
        let currentText = currentEl.innerText;
        let nextNum = (currentText === "--" || currentText === "") ? 1 : parseInt(currentText.replace("Q", "")) + 1;
        let nextQ = "Q" + String(nextNum).padStart(3, '0');
        socket.emit("set_queue", { queue: nextQ, voice_on_counter: voiceToggle.checked });
    }

    function handleManualSet() {
        unlockAudio();
        let val = inputEl.value.trim();
        if (val === "") return;
        socket.emit("set_queue", { queue: "Q" + val.padStart(3, '0'), voice_on_counter: voiceToggle.checked });
        inputEl.value = "";
    }

    function handleCallAgain() {
        unlockAudio();
        if (currentEl.innerText !== "--") {
            socket.emit("set_queue", { queue: currentEl.innerText, voice_on_counter: voiceToggle.checked });
        }
    }

    function handleSkipOrder() {
        unlockAudio();
        socket.emit('skip_order', { voice_on_counter: voiceToggle.checked });
    }

    function handleResetSystem() {
        if (confirm("รีเซ็ตคิวทั้งหมด?")) socket.emit('reset');
    }

    socket.on("call_queue_locally", data => speakLocally(data.queue, false));
    socket.on("speak_locally", data => speakLocally(data.msg, true));
    socket.on("queue_updated", data => { 
        currentEl.innerText = data.current; 
        lastEl.innerText = data.last; 
    });
    socket.on("reset_done", () => { 
        currentEl.innerText = "--"; 
        lastEl.innerText = "--"; 
    });

    window.speechSynthesis.onvoiceschanged = getFemaleVoice;
</script>
</body>
</html>
