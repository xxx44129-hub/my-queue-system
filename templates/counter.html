<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>Queue Counter Control</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #f4f6f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .panel {
            background: white;
            width: 550px;
            max-width: 90vw;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
        }
        .current {
            font-size: clamp(80px, 15vw, 110px);
            font-weight: bold;
            color: #2a5298;
            margin: 10px 0;
        }
        .info { font-size: 18px; color: #666; margin-bottom: 20px; }
        #setQueue {
            font-size: 24px;
            padding: 12px;
            width: 60%;
            text-align: center;
            border-radius: 10px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }
        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        button {
            font-size: 20px;
            padding: 20px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: 0.1s;
        }
        button:active { transform: scale(0.95); }
        .next { background: #3498db; }
        .skip { background: #e67e22; }
        .again { background: #f1c40f; }
        .reset { background: #e74c3c; }
        .voice-control {
            margin-top: 20px;
            background: #eee;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; }
    </style>
</head>
<body>

<div class="panel">
    <h1>ระบบควบคุมคิว</h1>
    <div class="current" id="current">--</div>
    <div class="info">คิวล่าสุดในระบบ: <b id="last">--</b></div>

    <input id="setQueue" type="text" pattern="\d*" placeholder="เลข 3 หลัก">
    <br>
    <button style="background:#8e44ad; padding:10px 25px; font-size:16px;" onclick="handleAction('set')">ตั้งค่าคิว/เรียกเลขนี้</button>

    <div class="voice-control">
        <b>เปิดเล่นเสียงที่หน้าจอนี้:</b>
        <input type="checkbox" id="voiceToggle">
    </div>

    <div class="buttons">
        <button class="next" onclick="handleAction('next')">เรียกคิวถัดไป</button>
        <button class="skip" onclick="socket.emit('skip_order')">ข้าม ออเดอร์</button>
        <button class="again" onclick="handleAction('again')">เรียกซ้ำคิวบนจอ</button>
        <button class="reset" onclick="handleReset()">รีเซ็ตทั้งหมด</button>
    </div>
</div>

<script>
    const socket = io();
    const currentEl = document.getElementById("current");
    const lastEl = document.getElementById("last");
    const inputEl = document.getElementById("setQueue");
    const voiceToggle = document.getElementById("voiceToggle");
    let audioUnlocked = false;

    // ฟังก์ชันปลดล็อกเสียง
    function unlock() {
        if (!audioUnlocked) {
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
            audioUnlocked = true;
        }
    }

    // ฟังก์ชันพูดเฉพาะเครื่อง Counter
    function speakLocally(text) {
        if (!voiceToggle.checked) return;
        window.speechSynthesis.cancel();
        let digits = text.replace("Q", "").split("").join(" ");
        const msg = new SpeechSynthesisUtterance("คิว " + digits);
        msg.lang = 'th-TH';
        window.speechSynthesis.speak(msg);
    }

    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

    // จัดการทุกปุ่มผ่านฟังก์ชันเดียวเพื่อคุมสถานะสวิตช์
    function handleAction(type) {
        unlock();
        let targetQ = "";

        if (type === 'next') {
            // ดึงเลขจากหน้าจอมาบวกต่อ
            let currentNum = parseInt(currentEl.innerText.replace("Q", "")) || 0;
            targetQ = "Q" + String(currentNum + 1).padStart(3, '0');
        } 
        else if (type === 'set') {
            let val = inputEl.value.trim();
            if (!val) return;
            targetQ = "Q" + val.padStart(3, '0');
            inputEl.value = "";
        }
        else if (type === 'again') {
            targetQ = currentEl.innerText;
        }

        if (targetQ !== "--") {
            // 🎯 ส่งเลขคิว พร้อมบอก Server ว่าตอนนี้ "เปิดหรือปิด" เสียงที่นี่
            socket.emit("set_queue", { 
                queue: targetQ, 
                voice_on_counter: voiceToggle.checked 
            });
        }
    }

    function handleReset() {
        if (confirm("ล้างคิวทั้งหมดเป็น 0 ใช่ไหม?")) {
            socket.emit('reset');
        }
    }

    /* --- Socket Events --- */

    // รับคำสั่งพูดเฉพาะที่หน้า Counter (เมื่อ Server ตรวจสอบแล้วว่าเปิดสวิตช์ไว้)
    socket.on("call_queue_locally", data => {
        speakLocally(data.queue);
    });

    // อัปเดตตัวเลข (ทำทุกครั้งที่มีการเปลี่ยนแปลง)
    socket.on("queue_updated", data => {
        currentEl.innerText = data.current;
        lastEl.innerText = data.last;
    });

    socket.on("reset_done", () => {
        currentEl.innerText = "--";
        lastEl.innerText = "--";
    });

    socket.on("speak_only", data => {
        if (voiceToggle.checked) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(data.msg);
            msg.lang = 'th-TH';
            window.speechSynthesis.speak(msg);
        }
    });
</script>
</body>
</html>
