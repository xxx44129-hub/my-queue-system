<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Queue Counter (Voice Control)</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: #f4f6f9; height: 100vh; display: flex; justify-content: center; align-items: center; }
    .panel { background: white; width: 550px; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: center; position: relative; }
    .current { font-size: 96px; font-weight: bold; color: #2a5298; margin: 20px 0; }
    .info { font-size: 18px; color: #555; margin-bottom: 20px; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    button { font-size: 20px; padding: 18px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; -webkit-tap-highlight-color: transparent; }
    .new { background: #27ae60; color: white; }
    .next { background: #2980b9; color: white; }
    .skip { background: #e67e22; color: white; }
    .again { background: #f39c12; color: white; }
    .reset { background: #c0392b; color: white; }
    
    .voice-control {
        margin-top: 20px; padding: 15px; background: #eee; border-radius: 10px;
        display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #2196F3; }
    input:checked + .slider:before { transform: translateX(26px); }
</style>
</head>

<body onclick="unlockAudio()">
<div class="panel">
    <h1>ระบบควบคุมคิว</h1>
    <div class="current" id="current">--</div>
    <div class="info">คิวล่าสุด: <b id="last">--</b></div>

    <input id="setQueue" type="text" pattern="\d*" placeholder="กรอกเลขคิว เช่น 002" 
        style="font-size:22px;padding:12px;width:80%;text-align:center;border-radius:10px;border:1px solid #ccc;">
    <br><br>
    <button style="background:#8e44ad;color:white;padding:12px 30px;border-radius:10px;"
        onclick="handleSetQueue()">ตั้งค่าคิว</button>

    <div class="voice-control">
        <span><b>เปิดเสียงที่หน้าจอนี้:</b></span>
        <label class="switch">
            <input type="checkbox" id="voiceToggle">
            <span class="slider"></span>
        </label>
    </div>

    <br>
    <div class="buttons">
        <button class="new" onclick="socket.emit('new_queue')">รับคิวใหม่</button>
        <button class="next" onclick="handleCallNext()">เรียกคิวถัดไป</button>
        <button class="skip" onclick="socket.emit('skip_order')">ข้าม Order</button>
        <button class="again" onclick="handleAgain()">เรียกซ้ำ/คิวที่กรอก</button>
        <button class="reset" onclick="handleReset()">รีเซ็ต</button>
    </div>
</div>

<script>
const socket = io();
const currentEl = document.getElementById("current");
const lastEl = document.getElementById("last");
const inputEl = document.getElementById("setQueue");
const voiceToggle = document.getElementById("voiceToggle");
let audioUnlocked = false;

function unlockAudio() {
    if (audioUnlocked) return;
    const msg = new SpeechSynthesisUtterance("");
    window.speechSynthesis.speak(msg);
    audioUnlocked = true;
}

// 🎯 ฟังก์ชันช่วยแยกตัวเลขให้อ่านเป็นตัวๆ
function formatSpeakText(text) {
    if (text.startsWith("Q")) {
        // แยก Q และตัวเลขออกจากกัน เช่น "Q 4 0 5"
        return "คิว " + text.substring(1).split("").join(" ");
    }
    return text;
}

function getBestFemaleThaiVoice() {
    const voices = window.speechSynthesis.getVoices();
    const femaleKeywords = ['Google ภาษาไทย', 'Kanya', 'Narisa', 'Pattara', 'Female'];
    const thaiVoices = voices.filter(v => v.lang && v.lang.startsWith('th'));
    for (let kw of femaleKeywords) {
        let found = thaiVoices.find(v => v.name.includes(kw));
        if (found) return found;
    }
    return thaiVoices.length > 0 ? thaiVoices[0] : null;
}

function speak(text) {
    if (!voiceToggle.checked) return;

    // ล้างคิวเสียงเก่าทิ้งทันทีเพื่อลดดีเลย์
    window.speechSynthesis.cancel();

    // ปรับรูปแบบข้อความก่อนอ่าน
    const formattedText = formatSpeakText(text);
    const msg = new SpeechSynthesisUtterance(formattedText);
    
    msg.lang = 'th-TH';
    msg.rate = 0.8; // ปรับให้เร็วขึ้นนิดหนึ่งเพื่อให้ลื่นไหล
    msg.pitch = 1.0;

    const selectedVoice = getBestFemaleThaiVoice();
    if (selectedVoice) msg.voice = selectedVoice;
    
    window.speechSynthesis.speak(msg);
}

window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

function handleCallNext() {
    const lastStr = lastEl.innerText;
    const currentStr = currentEl.innerText;
    if (lastStr !== "--") {
        const lastNum = parseInt(lastStr.substring(1));
        const currentNum = currentStr === "--" ? 0 : parseInt(currentStr.substring(1));
        if (currentNum < lastNum) {
            const nextQ = "Q" + String(currentNum + 1).padStart(3, '0');
            currentEl.innerText = nextQ;
        }
    }
    socket.emit('call_next');
}

function handleAgain() {
    let val = inputEl.value.trim().toUpperCase();
    if (val !== "") {
        if (!val.startsWith("Q")) val = "Q" + val.padStart(3, '0');
        socket.emit("set_queue", { queue: val });
        inputEl.value = "";
    } else {
        socket.emit('call_again');
    }
}

function handleSetQueue() {
    let val = inputEl.value.trim().toUpperCase();
    if (val === "") return;
    if (!val.startsWith("Q")) val = "Q" + val.padStart(3, '0');
    socket.emit("set_queue", { queue: val });
    inputEl.value = "";
}

function handleReset() {
    if (confirm("ต้องการล้างคิวทั้งหมดใช่ไหม?")) { socket.emit('reset'); }
}

socket.on("call_queue", data => {
    currentEl.innerText = data.queue;
    speak(data.msg); 
});

socket.on("speak_only", data => {
    speak(data.msg); 
});

socket.on("queue_updated", data => {
    lastEl.innerText = data.last;
    currentEl.innerText = data.current;
});
</script>
</body>
</html>
