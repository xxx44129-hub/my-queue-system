<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Queue Counter (Voice Control)</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
    body {
        margin: 0;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .panel {
        background: #ffffff;
        width: 550px;
        max-width: 92vw;
        border-radius: 22px;
        padding: 32px 28px;
        box-shadow:
            0 20px 40px rgba(0,0,0,0.12),
            0 6px 16px rgba(0,0,0,0.08);
        text-align: center;
        position: relative;
    }

    h1 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 26px;
        color: #1e293b;
        font-weight: 700;
    }

    .current {
        font-size: clamp(72px, 18vw, 110px);
        font-weight: 800;
        color: #2563eb;
        margin: 20px 0 10px;
        letter-spacing: 2px;
    }

    .info {
        font-size: 18px;
        color: #475569;
        margin-bottom: 22px;
    }

    #setQueue {
        font-size: 22px;
        padding: 14px;
        width: 80%;
        max-width: 360px;
        text-align: center;
        border-radius: 12px;
        border: 1px solid #cbd5e1;
        outline: none;
        transition: border 0.15s, box-shadow 0.15s;
    }

    #setQueue:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }

    .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 10px;
    }

    button {
        font-size: 20px;
        padding: 18px 12px;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        font-weight: 700;
        color: white;
        transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.08s;
        -webkit-tap-highlight-color: transparent;
    }

    button:active {
        transform: scale(0.97);
        box-shadow: 0 4px 10px rgba(0,0,0,0.2) inset;
    }

    .next { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .skip { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .again { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
    .reset { background: linear-gradient(135deg, #ef4444, #dc2626); }

    .voice-control {
        margin-top: 22px;
        padding: 14px;
        background: #f1f5f9;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 15px;
        color: #334155;
    }

    .switch {
        position: relative;
        display: inline-block;
        width: 56px;
        height: 32px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #cbd5e1;
        transition: .3s;
        border-radius: 32px;
    }

    .slider:before {
        position: absolute;
        content: "";
        height: 24px;
        width: 24px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        transition: .3s;
        border-radius: 50%;
        box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }

    input:checked + .slider { background-color: #2563eb; }
    input:checked + .slider:before { transform: translateX(24px); }
</style>
</head>

<body>
<div class="panel">
    <h1>ระบบควบคุมคิว</h1>
    <div class="current" id="current">--</div>
    <div class="info">คิวล่าสุด: <b id="last">--</b></div>

    <input id="setQueue" type="text" pattern="\d*" placeholder="กรอกเลข เช่น 001">
    <br><br>

    <button style="background:#8e44ad;color:white;padding:12px 30px;border-radius:10px;"
        onclick="handleSetQueue()">ตั้งค่าคิว</button>

    <div class="voice-control">
        <span><b>เปิดเสียงที่หน้าจอนี้:</b></span>
        <label class="switch">
            <input type="checkbox" id="voiceToggle">
            <span class="slider"></span>
        </label>
    </div>

    <br>

    <div class="buttons">
        <button class="next" onclick="handleNext()">เรียกคิวถัดไป</button>
        <button class="skip" onclick="handleSkip()">ข้าม Order</button>
        <button class="again" onclick="handleAgainBtn()">เรียกซ้ำ/คิวที่กรอก</button>
        <button class="reset" onclick="handleReset()">รีเซ็ต</button>
    </div>
</div>

<script>
const socket = io();
const currentEl = document.getElementById("current");
const lastEl = document.getElementById("last");
const inputEl = document.getElementById("setQueue");
const voiceToggle = document.getElementById("voiceToggle");
let audioUnlocked = false;

/* --- ปลดล็อกเสียง --- */
function unlockAudio() {
    if (audioUnlocked) return;
    const msg = new SpeechSynthesisUtterance("");
    window.speechSynthesis.speak(msg);
    audioUnlocked = true;
}

/* --- ฟังก์ชันพูด (ใช้เฉพาะหน้านี้) --- */
function speak(text) {
    if (!voiceToggle.checked) return; // ถ้าสวิตช์ปิดอยู่ ไม่ต้องพูด

    window.speechSynthesis.cancel();
    
    // จัดรูปแบบให้อ่านทีละหลัก
    let rawDigits = text.replace("Q", "");
    let separated = rawDigits.split("").join(" ");
    let finalMsg = "คิว " + separated;

    const msg = new SpeechSynthesisUtterance(finalMsg);
    msg.lang = 'th-TH';
    msg.rate = 0.8;
    
    // หาเสียงภาษาไทย
    const voices = window.speechSynthesis.getVoices();
    const thaiVoice = voices.find(v => v.lang.startsWith('th'));
    if (thaiVoice) msg.voice = thaiVoice;

    window.speechSynthesis.speak(msg);
}

window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

/* --- Logic ปุ่มถัดไป --- */
function handleNext() {
    unlockAudio();
    let currentStr = currentEl.innerText;
    let nextNum = 1;

    if (currentStr !== "--" && currentStr !== "") {
        nextNum = parseInt(currentStr.replace("Q", "")) + 1;
    }
    if (nextNum > 999) nextNum = 1;
    const nextQ = "Q" + String(nextNum).padStart(3, '0');
    
    // 🎯 แก้จุดนี้: พูดทันทีที่เครื่องนี้ (ไม่ต้องรอ Server)
    speak(nextQ);

    // ส่งสัญญาณไปบอกหน้าจอ Display และเครื่องอื่นๆ
    socket.emit("set_queue", { queue: nextQ });
}

function handleAgainBtn() {
    unlockAudio();
    let val = inputEl.value.trim().toUpperCase();
    let targetQ = "";

    if (val !== "") {
        if (!val.startsWith("Q")) val = "Q" + val.padStart(3, '0');
        targetQ = val;
        inputEl.value = "";
    } else {
        targetQ = currentEl.innerText;
    }

    if (targetQ !== "--") {
        speak(targetQ); // พูดทันทีที่เครื่องนี้
        socket.emit("set_queue", { queue: targetQ });
    }
}

function handleSetQueue() {
    unlockAudio();
    let val = inputEl.value.trim().toUpperCase();
    if (val === "") return;
    if (!val.startsWith("Q")) val = "Q" + val.padStart(3, '0');
    
    speak(val); // พูดทันทีที่เครื่องนี้
    socket.emit("set_queue", { queue: val });
    inputEl.value = "";
}

function handleSkip() { unlockAudio(); socket.emit('skip_order'); }
function handleReset() { 
    unlockAudio(); 
    if (confirm("รีเซ็ต?")) socket.emit('reset'); 
}

/* --- Socket Events --- */
socket.on("call_queue", data => {
    currentEl.innerText = data.queue;
    // ถ้าหน้าจอนี้เปิดเสียงไว้ ก็จะพูดเมื่อมีการอัปเดตมาจากเครื่องอื่นด้วย
    speak(data.queue); 
});

socket.on("queue_updated", data => {
    lastEl.innerText = data.last;
    currentEl.innerText = data.current;
});
</script>
</body>
</html>
